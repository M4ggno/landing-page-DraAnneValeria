<section id="diferenciais" aria-labelledby="diff-heading" class="py-28 px-[4vw] bg-dark-warm">
  <div class="text-center mb-16">
    <span class="inline-block font-sans text-[0.68rem] font-medium tracking-[0.22em] uppercase text-gold mb-4">Por que escolher</span>
    <h2 id="diff-heading" class="font-serif font-light text-[clamp(2rem,3.5vw,3rem)] leading-[1.15]">
      Medicina com <em class="italic text-gold-light">presença</em>
    </h2>
    <p class="mt-3 font-sans text-[0.9rem] text-stone max-w-[540px] mx-auto leading-[1.7]">
      Três décadas e meia dedicadas a entender cada paciente de forma integral —
      com rigor técnico e escuta genuína.
    </p>
  </div>

  <ol class="max-w-3xl mx-auto divide-y divide-gold/15 border-y border-gold/15">
    @for (item of items; track item.title; let i = $index) {
      <li appFadeIn [style.transition-delay.s]="i * 0.1" class="grid grid-cols-[auto_1fr] gap-x-8 gap-y-1 py-7 items-baseline">
        <span class="font-serif italic font-light text-xl text-rust">{{ pad(i) }}</span>
        <div>
          <h3 class="font-serif text-[1.3rem] font-normal mb-1">{{ item.title }}</h3>
          <p class="font-sans text-[0.85rem] leading-[1.65] text-stone">{{ item.text }}</p>
        </div>
      </li>
    }
  </ol>
</section>

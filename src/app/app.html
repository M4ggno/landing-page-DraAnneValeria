<app-loader />
<app-three-background />

<div class="relative z-[1]">
  <app-navbar />
  <main>
    <app-hero />
    <!-- Seções abaixo da dobra viram chunks separados, renderizados assim que o navegador fica ocioso -->
    @defer (on idle) {
      <app-differentials />
      <app-services />
      <app-about />
      <app-locations />
      <app-faq />
      <app-cta />
    } @placeholder {
      <div class="min-h-svh" aria-hidden="true"></div>
    }
  </main>
  @defer (on idle) {
    <app-footer />
  }
</div>
